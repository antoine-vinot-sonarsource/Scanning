plugins {
    id 'java'
    id "org.sonarqube" version "7.2.2.6593"
}

java {
    sourceCompatibility = '17'
}

sonar {
    properties {
        property "sonar.sources", "C:\\Users\\antoine.vinot\\Dev\\Projects\\Scanning\\src\\main\\java\\pokemon"
        property "sonar.tests", "C:\\Users\\antoine.vinot\\Dev\\Projects\\Scanning\\src\\main\\java\\pokemon"
    }
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation 'org.springframework:spring-web:4.3.11.RELEASE'
}

test {
    useJUnitPlatform()
}
